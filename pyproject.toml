[build-system]
# only-include of the sdist needs hatchling 1.4.0 or later.
requires = ["hatchling>=1.4.0"]
build-backend = "hatchling.build"

[project]
name = "kicad-workbench"
# The version is __version__ of the package: one source for the metadata and the
# release check (version_check.py).
dynamic = ["version"]
description = "MCP server that lets an AI agent work with KiCad 8, 9 and 10 projects: schematics, boards, libraries, ERC and DRC, BOM and edits"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Turbyho" },
    { name = "Seeed Studio" },
]
keywords = ["kicad", "mcp", "schematic", "pcb", "eda", "bom", "erc", "drc"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    # The upper bounds are load-bearing. Without them pip/uv resolve
    # fastmcp 2.14.1 + mcp 2.0.0, which install WITHOUT pydantic-settings,
    # and the server dies on import (ModuleNotFoundError: pydantic_settings).
    # Keep these in sync with requirements.txt.
    "mcp>=1.27,<2",
    "fastmcp>=3.2,<4",
    "pydantic>=2.0.0",
    # The version comparison of the release check (version_check).
    "packaging>=22",
    # Draws the SVG of kicad-cli as PNG (render_library_item). 0.x: the API can change.
    "resvg-py>=0.5.0,<0.6",
]

[project.optional-dependencies]
test = [
    # tests/test_build_content.py builds the sdist and the wheel.
    "hatchling>=1.4.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
]
dev = [
    # The extra "test" and ruff, as requirements-dev.txt (-r requirements-test.txt).
    "kicad-workbench[test]",
    # The same version as requirements-dev.txt, which the CI workflows read.
    "ruff==0.17.4",
]

[project.scripts]
kicad-workbench = "kicad_workbench.__main__:main"

[project.urls]
Homepage = "https://github.com/turbyho/kicad-workbench"
Documentation = "https://github.com/turbyho/kicad-workbench#readme"
Issues = "https://github.com/turbyho/kicad-workbench/issues"

[tool.hatch.version]
path = "src/kicad_workbench/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kicad_workbench"]

# The sdist has only the files of this list. The repository also has private files
# (plans/, spike/, CLAUDE.md, docs/kicad-ipc/ and the other blocked paths of
# .publish-filter), and these must not go to PyPI. tests/test_build_content.py
# builds the sdist and the wheel and does a check of their files.
[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "tests",
    "docs",
    "README.md",
    "CHANGELOG.md",
    "LICENSE",
    "pyproject.toml",
    "requirements.txt",
    "requirements-dev.txt",
    "requirements-test.txt",
]
exclude = ["docs/kicad-ipc"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "file_versions: the test runs the check of the file versions of the schematics and the boards against the installed KiCad (utils/file_versions.py)",
]
